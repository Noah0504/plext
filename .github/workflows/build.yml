name: build

on:
  push:
    branches: [main]
  pull_request:
  # Publishing a release on GitHub builds the binaries and attaches them to the release.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep in sync with the alsa-lib version named in about.hbs / THIRD-PARTY-LICENSES.md.
  ALSA_VERSION: "1.2.13"

jobs:
  # 64-bit builds, each on its own CPU: x86_64, and aarch64 (Raspberry Pi 3, 4,
  # 5 and Zero 2 W running a 64-bit OS) on GitHub's Arm runners, so the tests
  # run on real Arm hardware.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - name: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Alpine uses musl, which lets us produce a fully static binary that runs on any distro.
    container: rust:alpine
    env:
      PKG_CONFIG_ALL_STATIC: "1"
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - name: Install build tools
        run: apk add --no-cache build-base musl-dev pkgconf linux-headers curl tar bzip2 file ffmpeg git bash

      - uses: actions/checkout@v4

      # Alpine doesn't ship a static libasound, so build one.
      - name: Build static alsa-lib ${{ env.ALSA_VERSION }}
        run: |
          curl -fsSL "https://www.alsa-project.org/files/pub/lib/alsa-lib-${ALSA_VERSION}.tar.bz2" | tar xj -C /tmp
          cd /tmp/alsa-lib-${ALSA_VERSION}
          ./configure --prefix=/usr --sysconfdir=/etc --with-configdir=/usr/share/alsa \
            --enable-static --disable-shared --disable-python --disable-topology \
            --disable-ucm --disable-aload --without-debug
          make -j"$(nproc)"
          make install

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --release --locked 2>&1 | tee test.log; then
            # Surface the failure as an annotation so it's visible without downloading logs.
            msg=$(grep -vE '^\s+(Compiling|Downloaded|Downloading) ' test.log | tail -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=cargo test failed (${{ matrix.name }})::${msg}"
            exit 1
          fi

      - name: Build
        run: |
          cargo build --release --locked
          bin=target/${{ matrix.target }}/release/plext
          file "$bin"
          # Fail if the binary depends on any shared library.
          if file "$bin" | grep -q "dynamically linked"; then
            echo "binary is not static"; exit 1
          fi
          "$bin" --version

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/plext dist/
          cp README.md LICENSE THIRD-PARTY-LICENSES.md dist/
          tar -C dist -czf plext-${{ matrix.name }}-linux.tar.gz plext README.md LICENSE THIRD-PARTY-LICENSES.md
          sha256sum plext-${{ matrix.name }}-linux.tar.gz > plext-${{ matrix.name }}-linux.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: plext-${{ matrix.name }}-linux
          path: |
            plext-${{ matrix.name }}-linux.tar.gz
            plext-${{ matrix.name }}-linux.tar.gz.sha256

      - name: Publish release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plext-${{ matrix.name }}-linux.tar.gz
            plext-${{ matrix.name }}-linux.tar.gz.sha256

  # 32-bit Arm, cross-compiled with a musl cross toolchain and tested under
  # QEMU emulating the oldest CPU each build supports, so an instruction
  # those CPUs lack fails the tests here rather than on someone's Pi:
  #   armv6: Raspberry Pi 1, Zero and Zero W (ARM1176), and any Pi on a 32-bit OS
  #   armv7: Raspberry Pi 2 and newer on a 32-bit OS (Cortex-A7)
  linux-arm32:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armv6
            target: arm-unknown-linux-musleabihf
            image: arm-musleabihf
            qemu_cpu: arm1176
          - name: armv7
            target: armv7-unknown-linux-musleabihf
            image: armv7-musleabihf
            qemu_cpu: cortex-a7
    runs-on: ubuntu-latest
    container: ghcr.io/rust-cross/rust-musl-cross:${{ matrix.image }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      RUSTFLAGS: "-C target-feature=+crt-static"
      PKG_CONFIG_ALL_STATIC: "1"
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_PATH: /opt/alsa/lib/pkgconfig
    steps:
      - name: Install build and test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            curl ca-certificates bzip2 file pkg-config qemu-user ffmpeg alsa-utils git

      - uses: actions/checkout@v4

      - name: Find the cross compiler
        shell: bash
        run: |
          cc=$(command -v ${{ matrix.target }}-gcc || ls /usr/local/musl/bin/*-gcc 2>/dev/null | head -1)
          [ -n "$cc" ] || { echo "no cross gcc found"; ls /usr/local/musl/bin || true; exit 1; }
          echo "CROSS_CC=$cc" >> "$GITHUB_ENV"
          "$cc" --version | head -1
          # The CPU the toolchain targets by default (must be armv6 for the Pi 1/Zero build).
          "$cc" -Q --help=target 2>/dev/null | grep -E '^\s+-m(arch|cpu|fpu|float-abi)=' || true
          rustc --version
          rustup target add ${{ matrix.target }} || true
          t=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${t}_RUNNER=qemu-arm -cpu ${{ matrix.qemu_cpu }}" >> "$GITHUB_ENV"

      - name: Build static alsa-lib ${{ env.ALSA_VERSION }}
        shell: bash
        run: |
          curl -fsSL "https://www.alsa-project.org/files/pub/lib/alsa-lib-${ALSA_VERSION}.tar.bz2" | tar xj -C /tmp
          cd /tmp/alsa-lib-${ALSA_VERSION}
          # Installed into /opt/alsa, but looking for its configuration where
          # Raspberry Pi OS (and every other distro) keeps it.
          ./configure --host=${{ matrix.target }} CC="$CROSS_CC" \
            --prefix=/opt/alsa --sysconfdir=/etc --with-configdir=/usr/share/alsa \
            --enable-static --disable-shared --disable-python --disable-topology \
            --disable-ucm --disable-aload --without-debug
          make -j"$(nproc)"
          make install

      - name: Test (under QEMU, ${{ matrix.qemu_cpu }})
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --release --locked 2>&1 | tee test.log; then
            msg=$(grep -vE '^\s+(Compiling|Downloaded|Downloading) ' test.log | tail -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=cargo test failed (${{ matrix.name }})::${msg}"
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked
          bin=target/${{ matrix.target }}/release/plext
          file "$bin"
          if file "$bin" | grep -q "dynamically linked"; then
            echo "binary is not static"; exit 1
          fi
          qemu-arm -cpu ${{ matrix.qemu_cpu }} "$bin" --version
          ls -l "$bin"

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/plext dist/
          cp README.md LICENSE THIRD-PARTY-LICENSES.md dist/
          tar -C dist -czf plext-${{ matrix.name }}-linux.tar.gz plext README.md LICENSE THIRD-PARTY-LICENSES.md
          sha256sum plext-${{ matrix.name }}-linux.tar.gz > plext-${{ matrix.name }}-linux.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: plext-${{ matrix.name }}-linux
          path: |
            plext-${{ matrix.name }}-linux.tar.gz
            plext-${{ matrix.name }}-linux.tar.gz.sha256

      - name: Publish release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plext-${{ matrix.name }}-linux.tar.gz
            plext-${{ matrix.name }}-linux.tar.gz.sha256
