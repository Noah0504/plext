[package]
name = "plext"
version = "0.6.0"
edition = "2021"
description = "A terminal music player for Plex with bit-perfect playback straight to your DAC"
license = "MIT"
repository = "https://github.com/Noah0504/plext"
readme = "README.md"

[dependencies]
anyhow = "1"
alsa = "0.9"
clap = { version = "4", features = ["derive"] }
dirs = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["all"] }
toml = "0.8"
ureq = { version = "2", features = ["json"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
pulseaudio = "0.3.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
