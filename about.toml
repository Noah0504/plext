# Configuration for cargo-about, which collects the licenses of every Rust
# crate compiled into Plext. Regenerate THIRD-PARTY-LICENSES.md with:
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.md
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
targets = ["x86_64-unknown-linux-musl"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
